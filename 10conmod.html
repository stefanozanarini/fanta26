sta e di piede, e ha mostrato una grande capacità realizzativa (11 gol nella stagione della promozione)."},{"name":"CALÒ","team":"Frosinone","role":"C","pma":12,"pfc":10.55,"tit":88,"comment":"Nella stagione 2025-26 è stato decisivo sia in fase di costruzione che in inserimento (numeri da top: tanti gol + moltissimi assist). Ha grande visione di gioco, qualità nei passaggi progressivi e capacità di arrivare al tiro da fuori o di inserirsi."},{"name":"ADORANTE","team":"Venezia","role":"A","pma":1.5,"pfc":0.5,"tit":48,"comment":""},{"name":"STANKOVIC F.","team":"Venezia","role":"P","pma":5.85,"pfc":10.35,"tit":91,"comment":"Portiere reattivo e moderno. Figlio d’arte, ha buon gioco con i piedi, presenza in area e capacità di costruire dal basso. È il punto fermo tra i pali e uno dei valori più solidi della rosa."},{"name":"THIAM","team":"Monza","role":"P","pma":3,"pfc":7.95,"tit":91,"comment":"È lui il portiere titolare del Monza e lo scorso anno ha dimostrato ottime cose. Può essere un buon terzo slot low cost."},{"name":"RRAHMANI AL.","team":"Venezia","role":"A","pma":2.4,"pfc":8.35,"tit":78,"comment":"Attaccante molto rapido e dotato di ottimo fiuto del gol. Nelle gerarchie però parte dietro ad Adams, quindi si può prendere come sua riserva a 1 credito o come scommessa sempre a 1 credito."},{"name":"CACCIAMANI","team":"Torino","role":"C","pma":6.55,"pfc":5.15,"tit":90,"comment":""},{"name":"PESSINA","team":"Monza","role":"C","pma":3.2,"pfc":2.45,"tit":75,"comment":"Ha buona visione di gioco, tecnica pulita e capacità di leggere gli spazi tra le linee. È una “mezzala moderna” che unisce inserimenti offensivi, lavoro difensivo e personalità. Nel Monza è il capitano e leader, come giocatore affidabile da quinto/sesto slot si può prendere."},{"name":"BUSIO","team":"Venezia","role":"C","pma":4.25,"pfc":16.7,"tit":92,"comment":"Il motore del centrocampo. Dinamico, tecnico e con buon senso del gol. Inserisce, recupera e contribuisce in entrambe le fasi: uno dei più completi della mediana. Come sesto/settimo slot può essere valido."},{"name":"PALMISANI","team":"Frosinone","role":"P","pma":1.95,"pfc":1.65,"tit":86,"comment":""},{"name":"KAIKI","team":"Como","role":"D","pma":10.95,"pfc":14.15,"tit":88,"comment":"Fabregas lo aveva cercato anche a gennaio, ma il Cruzeiro bloccò il suo trasferimento. In questa sessione estiva il Como è tornato subito all'attacco per acquistarlo, segno che l'allenatore ci crede molto. Crediamo che sarà lui il titolare come terzino sinistro. Non è un goleador, ma ha grande propensione offensiva e sforna tanti cross. I +1 sono nelle sue corde."},{"name":"MUTANDWA","team":"Cagliari","role":"A","pma":1.15,"pfc":2.05,"tit":52,"comment":""},{"name":"COLPANI","team":"Monza","role":"C","pma":8.55,"pfc":7.55,"tit":88,"comment":""},{"name":"HAVEL","team":"Genoa","role":"A","pma":1.2,"pfc":5.95,"tit":63,"comment":""},{"name":"DRAGUSIN","team":"Fiorentina","role":"D","pma":15.4,"pfc":13,"tit":84,"comment":"Sarà uno dei due titolari nei centrali di difesa della Fiorentina. In Serie A ha già dimostrato di poter dire la sua e di poter anche portare bonus sugli sviluppi da calcio piazzato."},{"name":"MEICHTRY","team":"Genoa","role":"C","pma":1.55,"pfc":0.5,"tit":74,"comment":"Ci intriga parecchio. Nella passata stagione in Svizzera ha totalizzato 6 reti. Grandi doti fisiche e capacità d'inserimento. Non parte avanti nelle gerarchie, ma crediamo che potrà ritagliarsi il suo spazio."},{"name":"STANKOVIC A.","team":"Inter","role":"C","pma":2.4,"pfc":0.5,"tit":70,"comment":""},{"name":"KOUTSOUPIAS","team":"Frosinone","role":"C","pma":1.3,"pfc":0.5,"tit":88,"comment":""},{"name":"KVERNADZE","team":"Frosinone","role":"A","pma":4.4,"pfc":1.15,"tit":88,"comment":"Buona velocità e capacità di 1vs1, sa sia stare largo che accentrarsi. Ha un buon tiro e capacità di creare superiorità numerica. Nella stagione della promozione ha dimostrato di saper essere decisivo sia in fase di finalizzazione che di assist."},{"name":"MOTA","team":"Monza","role":"A","pma":4.55,"pfc":6.05,"tit":82,"comment":"Versatile, può giocare da seconda punta, esterno o trequartista. Veloce, tecnico nello stretto e abile nell’uno contro uno. Ha buon dribbling, capacità di creare e anche di finalizzare. Non è un pure centravanti, ma un attaccante moderno che si muove tanto, pressa e lega il gioco. Spesso decisivo nelle azioni di qualità. In Serie A ha già dimostrato di poter fare il suo."},{"name":"UNAI GOMEZ","team":"Udinese","role":"C","pma":3.35,"pfc":0.5,"tit":70,"comment":"Centrocampista moderno e molto duttile, cresciuto nell’Athletic Bilbao. Può giocare praticamente in tutte le zone del centrocampo: da trequartista, mezzala e anche mediano. È un profilo “moderno” che unisce qualità spagnola e carattere. All’Udinese può essere utile sia per dare equilibrio che per produrre gioco tra le linee. Lui stesso ha detto di voler migliorare nella finalizzazione, perché finora ha prodotto più corsa e lavoro che gol. Può essere una buona scommessa da sesto/settimo slot."},{"name":"COLOMBO L.","team":"Monza","role":"C","pma":1.45,"pfc":0.5,"tit":76,"comment":""},{"name":"GELLI F.","team":"Frosinone","role":"C","pma":1.05,"pfc":0.5,"tit":52,"comment":""},{"name":"CHAKVETADZE","team":"Udinese","role":"C","pma":1.05,"pfc":0.5,"tit":61,"comment":"Trequartista/mezzala offensiva (o esterno sinistro) di qualità, arrivato definitivamente dal Watford. Scommessa da quinto/sesto slot."},{"name":"CICHELLA","team":"Frosinone","role":"C","pma":1.25,"pfc":0.5,"tit":88,"comment":""},{"name":"HAPS","team":"Venezia","role":"D","pma":3.35,"pfc":0.5,"tit":88,"comment":""},{"name":"PEDRAZA","team":"Lazio","role":"D","pma":3.7,"pfc":6.25,"tit":88,"comment":""},{"name":"BIRINDELLI","team":"Monza","role":"D","pma":3.5,"pfc":0.75,"tit":90,"comment":"Veloce, dinamico e abile nei cross. Ha buona tecnica di base e sa sovrapporsi con continuità. Aggressivo e resistente, è uno dei giocatori più propositivi della fascia destra. Come giocatore da ultimi slot può essere preso. Ricordandovi sempre chi il Monza lotterà per non retrocedere."},{"name":"BRACAGLIA","team":"Frosinone","role":"D","pma":1.65,"pfc":0.5,"tit":76,"comment":""},{"name":"MILLA","team":"Como","role":"C","pma":1.3,"pfc":0.5,"tit":52,"comment":"Sulla carta è il sostituto di Perrone. Con i tanti impegni del Como potrebbe avere spazio, ma non è un giocatore da bonus. Potete fare altre scelte. Evitabile."},{"name":"OYONO A.","team":"Frosinone","role":"D","pma":1.65,"pfc":0.5,"tit":92,"comment":""},{"name":"CARBONI A.","team":"Monza","role":"D","pma":1.3,"pfc":0.5,"tit":88,"comment":"Centrale solido e duttile, bravo nei duelli e nella costruzione."},{"name":"BAKOUNE","team":"Monza","role":"D","pma":1,"pfc":0.5,"tit":72,"comment":""},{"name":"LAUBERBACH","team":"Venezia","role":"A","pma":0.95,"pfc":0.5,"tit":52,"comment":""},{"name":"DELLI CARRI","team":"Monza","role":"D","pma":1.3,"pfc":0.5,"tit":78,"comment":""},{"name":"VIERY","team":"Fiorentina","role":"D","pma":5.35,"pfc":9.2,"tit":92,"comment":"Difensore centrale o terzino sinistro classe 2005, brasiliano e con un ottimo mancino. Uno dei prospetti più interessanti del Brasile e Paratici ha deciso di acquistarlo per 15 milioni di euro. La sua duttilità lo porterà a essere molto utilizzato. Scommessa."},{"name":"FRANJIC","team":"Venezia","role":"D","pma":1.05,"pfc":0.5,"tit":72,"comment":""},{"name":"CALVANI","team":"Frosinone","role":"D","pma":1.3,"pfc":0.5,"tit":88,"comment":""},{"name":"OYONO J.","team":"Frosinone","role":"D","pma":1.4,"pfc":0.5,"tit":60,"comment":""},{"name":"EL AZZOUZI O.","team":"Bologna","role":"C","pma":1.45,"pfc":0.5,"tit":52,"comment":""},{"name":"PIZZIGNACCO","team":"Monza","role":"P","pma":0.9,"pfc":0.5,"tit":20,"comment":""},{"name":"MONTERISI","team":"Frosinone","role":"D","pma":2.85,"pfc":0.5,"tit":88,"comment":"Alto (190 cm), dominante nei duelli aerei e solido nei contrasti. Sa costruire dal basso con una certa qualità e non è solo un “distruttore”. Ha migliorato molto nella <script>
(function(){
  const SITE_PASSWORD = 'socmel';
  const SESSION_KEY = 'listone_unlocked';

  const lockScreen = document.getElementById('lockScreen');
  const lockForm = document.getElementById('lockForm');
  const lockInput = document.getElementById('lockInput');
  const lockError = document.getElementById('lockError');

  function unlock(){
    document.body.classList.remove('locked');
    lockScreen.style.display = 'none';
  }

  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    unlock();
  }

  lockForm.addEventListener('submit', function(e){
    e.preventDefault();
    if(lockInput.value === SITE_PASSWORD){
      sessionStorage.setItem(SESSION_KEY, '1');
      lockError.textContent = '';
      unlock();
    } else {
      lockError.textContent = 'Password errata, riprova.';
      lockInput.value = '';
      lockInput.focus();
    }
  });
})();
</script>
<script>
(function(){
  const state = {
    team: 'ALL',
    role: 'ALL',
    search: '',
    sortKey: 'pma',
    sortDir: 'desc',
    expanded: new Set()
  };

  function normalizeText(str){
    return String(str)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, ''); // strip accents, keep case-insensitivity robust
  }

  const teamGrid = document.getElementById('teamGrid');
  const roleTabs = document.getElementById('roleTabs');
  const searchInput = document.getElementById('searchInput');
  const tableBody = document.getElementById('tableBody');
  const countLabel = document.getElementById('countLabel');
  const emptyState = document.getElementById('emptyState');
  const theadRow = document.querySelector('thead tr');

  // Build team chips
  const allChip = document.createElement('button');
  allChip.className = 'team-chip all-chip active';
  allChip.textContent = 'Tutte';
  allChip.dataset.team = 'ALL';
  teamGrid.appendChild(allChip);

  TEAMS.forEach(function(team){
    const chip = document.createElement('button');
    chip.className = 'team-chip';
    chip.textContent = team;
    chip.dataset.team = team;
    teamGrid.appendChild(chip);
  });

  teamGrid.addEventListener('click', function(e){
    const btn = e.target.closest('.team-chip');
    if(!btn) return;
    state.team = btn.dataset.team;
    Array.from(teamGrid.children).forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });

  roleTabs.addEventListener('click', function(e){
    const btn = e.target.closest('.role-tab');
    if(!btn) return;
    state.role = btn.dataset.role;
    Array.from(roleTabs.children).forEach(function(c){ c.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });

  searchInput.addEventListener('input', function(e){
    state.search = normalizeText(e.target.value.trim());
    render();
  });

  tableBody.addEventListener('click', function(e){
    const row = e.target.closest('tr.player-row.has-comment');
    if(!row) return;
    const rowId = row.dataset.rowId;
    if(state.expanded.has(rowId)){
      state.expanded.delete(rowId);
    } else {
      state.expanded.add(rowId);
    }
    render();
  });

  theadRow.addEventListener('click', function(e){
    const th = e.target.closest('th');
    if(!th) return;
    const key = th.dataset.key;
    if(!key) return;
    if(state.sortKey === key){
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = (key === 'name' || key === 'team' || key === 'role') ? 'asc' : 'desc';
    }
    updateSortArrows();
    render();
  });

  function updateSortArrows(){
    Array.from(theadRow.children).forEach(function(th){
      const arrow = th.querySelector('.arrow');
      if(!arrow) return;
      if(th.dataset.key === state.sortKey){
        arrow.textContent = state.sortDir === 'asc' ? '▲' : '▼';
      } else {
        arrow.textContent = '';
      }
    });
  }

  function getFiltered(){
    return PLAYERS.filter(function(p){
      if(state.team !== 'ALL' && p.team !== state.team) return false;
      if(state.role !== 'ALL' && p.role !== state.role) return false;
      if(state.search && normalizeText(p.name).indexOf(state.search) === -1) return false;
      return true;
    });
  }

  function getSorted(list){
    const key = state.sortKey;
    const dir = state.sortDir === 'asc' ? 1 : -1;
    return list.slice().sort(function(a,b){
      let va = a[key], vb = b[key];
      if(va === null || va === undefined) va = (typeof vb === 'number') ? -Infinity : '';
      if(vb === null || vb === undefined) vb = (typeof va === 'number') ? -Infinity : '';
      if(typeof va === 'string'){
        return va.localeCompare(vb) * dir;
      }
      return (va - vb) * dir;
    });
  }

  function render(){
    const filtered = getSorted(getFiltered());
    countLabel.textContent = filtered.length + (filtered.length === 1 ? ' giocatore' : ' giocatori');

    if(filtered.length === 0){
      tableBody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    const rows = filtered.map(function(p, idx){
      const pma = (p.pma !== null && p.pma !== undefined) ? p.pma.toFixed(1) : '—';
      const pfc = (p.pfc !== null && p.pfc !== undefined) ? p.pfc.toFixed(1) : '—';
      const tit = (p.tit !== null && p.tit !== undefined) ? p.tit : null;
      const titBar = tit !== null
        ? '<div class="tit-bar-wrap"><div class="tit-bar"><div class="tit-bar-fill" style="width:' + tit + '%"></div></div><span class="tit-num">' + tit + '%</span></div>'
        : '<div class="tit-bar-wrap"><span class="tit-num">—</span></div>';

      const hasComment = !!(p.comment && p.comment.trim());
      const rowId = p.name + '|' + p.team;
      const isOpen = state.expanded.has(rowId);

      const infoCell = hasComment
        ? '<td class="info-cell"><button class="info-btn' + (isOpen ? ' open' : '') + '" type="button" aria-label="Mostra commento">+</button></td>'
        : '<td class="info-cell"><span class="info-placeholder"></span></td>';

      let html = '<tr class="player-row' + (hasComment ? ' has-comment' : '') + '" data-row-id="' + escapeHtml(rowId) + '">' +
        '<td><span class="role-badge ' + p.role + '">' + p.role + '</span></td>' +
        '<td class="player-name">' + escapeHtml(p.name) + '</td>' +
        '<td class="team-name">' + escapeHtml(p.team) + '</td>' +
        '<td class="num">' + pma + '</td>' +
        '<td class="num">' + pfc + '</td>' +
        '<td class="num">' + titBar + '</td>' +
        infoCell +
        '</tr>';

      if(hasComment && isOpen){
        html += '<tr class="detail-row"><td colspan="7">' +
          '<div class="comment-box">' + escapeHtml(p.comment) + '</div>' +
          '</td></tr>';
      }
      return html;
    });
    tableBody.innerHTML = rows.join('');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }

  updateSortArrows();
  render();
})();
</script>
</body>
</html>
